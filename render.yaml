# Render Blueprint — https://render.com/docs/blueprint-spec
# Free tier: backend sleeps after ~15 min inactivity (cold start ~30s on first request)

services:
  - type: web
    name: job-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
